<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Lucrattiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --bg: #F6F1E3;
    --surface: #FFFFFF;
    --surface-2: #EFE6CE;
    --ink: #201D14;
    --muted: #6C6450;
    --border: #E1D5B6;
    --border-soft: #ECE1C5;
    --accent: #1D4429;
    --accent-strong: #12301C;
    --accent-soft: #DEE9DE;
    --amber: #A97829;
    --amber-soft: #F1E0B4;
    --slate: #6E6142;
    --slate-soft: #E9E0C7;
    --red: #A5432B;
    --shadow: 0 1px 2px rgba(32, 27, 10, 0.07), 0 8px 24px -12px rgba(32, 27, 10, 0.2);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14150D;
      --surface: #1C1C13;
      --surface-2: #262518;
      --ink: #F0EAD6;
      --muted: #A9A084;
      --border: #383623;
      --border-soft: #2C2A1A;
      --accent: #75A664;
      --accent-strong: #9CC98A;
      --accent-soft: #223020;
      --amber: #DCAD5B;
      --amber-soft: #3B2E14;
      --slate: #BBAE85;
      --slate-soft: #2E2A18;
      --red: #E0917A;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14150D;
    --surface: #1C1C13;
    --surface-2: #262518;
    --ink: #F0EAD6;
    --muted: #A9A084;
    --border: #383623;
    --border-soft: #2C2A1A;
    --accent: #75A664;
    --accent-strong: #9CC98A;
    --accent-soft: #223020;
    --amber: #DCAD5B;
    --amber-soft: #3B2E14;
    --slate: #BBAE85;
    --slate-soft: #2E2A18;
    --red: #E0917A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    padding-inline: 20px;
    padding-block: 20px 48px;
    max-width: 1180px;
    margin-inline: auto;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { flex: none; width: 42px; height: 42px; }
  .brand h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-strong); }
  .brand .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }

  .conn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .conn[data-state="live"] .dot { background: var(--accent); }
  .conn[data-state="live"] { color: var(--accent-strong); border-color: var(--accent-soft); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    position: sticky;
    top: 20px;
  }
  @media (max-width: 860px) {
    .form-panel { position: static; }
  }
  .mobile-toggle { display: none; }
  @media (max-width: 860px) {
    .mobile-toggle {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .post-form { display: none; margin-top: 16px; }
    .form-panel.open .post-form { display: flex; }
  }

  .post-form { display: flex; flex-direction: column; gap: 12px; }
  .post-form h2 { font-size: 1.15rem; margin-bottom: 2px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, textarea {
    font: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .upload-row { display: flex; align-items: center; gap: 10px; }
  .upload-btn {
    border: 1px dashed var(--border);
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .upload-previews { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .upload-previews img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  .upload-hint { font-size: 0.78rem; color: var(--muted); }

  .submit-btn {
    margin-top: 4px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: var(--accent-strong); }
  .submit-btn:disabled { opacity: 0.6; cursor: progress; }

  .feed-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented button.active { background: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 0.85rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-media {
    aspect-ratio: 4 / 3;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.8rem;
    overflow: hidden;
    position: relative;
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-media .slide-nav {
    position: absolute;
    top: 0; bottom: 0;
    width: 34%;
    display: flex;
    align-items: center;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 1.3rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }
  .card-media:hover .slide-nav { opacity: 1; }
  .slide-nav.prev { left: 0; justify-content: flex-start; padding-left: 6px; }
  .slide-nav.next { right: 0; justify-content: flex-end; padding-right: 6px; }
  .slide-count {
    position: absolute;
    bottom: 6px; right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    pointer-events: none;
  }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-date { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .status-pill {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .status-pill[data-status="pendente"] { background: var(--amber-soft); color: var(--amber); }
  .status-pill[data-status="aprovado"] { background: var(--accent-soft); color: var(--accent-strong); }
  .status-pill[data-status="postado"] { background: var(--slate-soft); color: var(--slate); }

  .card-theme { font-family: "Fraunces", Georgia, serif; font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
  .tag { border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
  .card-caption {
    font-size: 0.87rem;
    color: var(--ink);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-hashtags { font-size: 0.78rem; color: var(--slate); word-break: break-word; }
  .card-notes { font-size: 0.78rem; color: var(--muted); font-style: italic; }
  .card-time {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }

  .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 4px; }
  .card-actions button {
    flex: 1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
  }
  .card-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card-actions button.primary:hover { background: var(--accent-strong); }
  .card-actions button.ghost:hover { border-color: var(--red); color: var(--red); }
  .icon-btn {
    flex: none !important;
    width: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 0.92rem;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  .next-run {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--accent-soft);
    color: var(--accent-strong);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .next-run .dot-pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-strong);
    flex: none;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="21" cy="21" r="21" fill="var(--accent-soft)"/>
      <rect x="9" y="20" width="6" height="10" rx="1.4" fill="var(--accent-strong)"/>
      <rect x="18" y="14" width="6" height="16" rx="1.4" fill="var(--amber)"/>
      <rect x="27" y="8" width="6" height="22" rx="1.4" fill="var(--accent-strong)"/>
    </svg>
    <div>
      <h1>Lucrattiva <span style="color: var(--amber); font-weight: 500;">Social</span></h1>
      <p class="subtitle">Lucrattiva Contabilidade · revisão do conteúdo diário</p>
    </div>
  </div>
  <div class="conn" id="connStatus" data-state="offline">
    <span class="dot"></span>
    <span id="connLabel">Conectando…</span>
  </div>
</div>

<div class="next-run" id="nextRunBar">
  <span class="dot-pulse"></span>
  <span id="nextRunLabel">Calculando próxima postagem…</span>
</div>

<div class="layout">
  <aside class="form-panel" id="formPanel">
    <button class="mobile-toggle" id="mobileToggle" type="button">+ Novo conteúdo</button>
    <form class="post-form" id="postForm">
      <h2>Novo conteúdo</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-date">Data</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-time">Horário</label>
          <input type="time" id="f-time" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-network">Rede</label>
          <select id="f-network">
            <option>Instagram</option>
            <option>Facebook</option>
            <option>LinkedIn</option>
            <option>WhatsApp</option>
            <option>Outra</option>
          </select>
        </div>
        <div class="field">
          <label for="f-format">Formato</label>
          <select id="f-format">
            <option>Imagem</option>
            <option>Carrossel</option>
            <option>Reels</option>
            <option>Vídeo</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-theme">Tema</label>
        <input type="text" id="f-theme" placeholder="Ex: Prazo do ITR 2026" required>
      </div>
      <div class="field">
        <label for="f-caption">Legenda final</label>
        <textarea id="f-caption" placeholder="Texto pronto para publicar" required></textarea>
      </div>
      <div class="field">
        <label for="f-hashtags">Hashtags / marcações</label>
        <input type="text" id="f-hashtags" placeholder="#ContabilidadeRural #ITR2026">
      </div>
      <div class="field">
        <label for="f-file">Imagens (uma ou várias, pra carrossel)</label>
        <div class="upload-row">
          <label class="upload-btn" id="uploadLabel" for="f-file">Escolher arquivos…</label>
          <input type="file" id="f-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
        </div>
        <div class="upload-previews" id="uploadPreviews"></div>
        <span class="upload-hint" id="uploadHint"></span>
      </div>
      <div class="field">
        <label for="f-notes">Observações internas (opcional)</label>
        <textarea id="f-notes" placeholder="Ex: aguardando aprovação da sócia"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Adicionar ao painel</button>
    </form>
  </aside>

  <main class="feed">
    <div class="feed-controls">
      <div class="segmented" id="filterBar" role="tablist">
        <button data-filter="todos" class="active" role="tab" aria-selected="true">Todos</button>
        <button data-filter="pendente" role="tab" aria-selected="false">Pendente</button>
        <button data-filter="aprovado" role="tab" aria-selected="false">Aprovado</button>
        <button data-filter="postado" role="tab" aria-selected="false">Postado</button>
      </div>
      <span class="count" id="countLabel"></span>
    </div>
    <div class="grid" id="grid" hidden></div>
    <p class="loading" id="loadingState">Carregando conteúdo…</p>
    <p class="empty" id="emptyState" hidden>Nenhum conteúdo por aqui ainda. Use o formulário ao lado para adicionar o primeiro.</p>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const STATUS_LABEL = { pendente: "Pendente", aprovado: "Aprovado", postado: "Postado" };
  const NEXT_STATUS = { pendente: "aprovado", aprovado: "postado" };
  const NEXT_LABEL = { pendente: "Aprovar", aprovado: "Marcar como postado" };
  const POLL_MS = 6000;

  let posts = new Map();
  let currentFilter = "todos";
  let pendingImages = []; // data URLs, resized client-side, uploaded on submit
  let slideIndex = new Map(); // post id -> currently shown image index

  const MAX_IMAGE_DIM = 1080;
  const IMAGE_QUALITY = 0.8;

  function resizeToDataUrl(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, MAX_IMAGE_DIM / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", IMAGE_QUALITY));
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error("Não foi possível ler a imagem"));
      img.src = URL.createObjectURL(file);
    });
  }

  const $ = (sel) => document.querySelector(sel);
  const grid = $("#grid");
  const loadingState = $("#loadingState");
  const emptyState = $("#emptyState");
  const countLabel = $("#countLabel");
  const toastEl = $("#toast");
  const connEl = $("#connStatus");

  function getPanelPassword() {
    let pw = localStorage.getItem("panelPassword");
    if (!pw) {
      pw = window.prompt("Senha do painel (pra criar, aprovar, excluir ou postar):") || "";
      if (pw) localStorage.setItem("panelPassword", pw);
    }
    return pw;
  }

  async function authFetch(url, options = {}) {
    const pw = getPanelPassword();
    const doFetch = (password) => fetch(url, {
      ...options,
      headers: { ...(options.headers || {}), "x-panel-password": password },
    });
    let res = await doFetch(pw);
    if (res.status === 401) {
      localStorage.removeItem("panelPassword");
      const pw2 = getPanelPassword();
      if (pw2) res = await doFetch(pw2);
    }
    return res;
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const [y, m, d] = iso.split("-");
    if (!y || !m || !d) return iso;
    return `${d}/${m}/${y}`;
  }

  function sortKey(p) {
    return `${p.date || "0000-00-00"} ${p.time || "00:00"}`;
  }

  function triggerBlobDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  async function downloadPostImages(post) {
    const images = Array.isArray(post.images) ? post.images : [];
    if (!images.length) return;
    const slug = (post.theme || "conteudo")
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
      .slice(0, 40) || "conteudo";
    try {
      if (images.length === 1) {
        const res = await fetch(images[0]);
        const blob = await res.blob();
        const ext = blob.type.includes("png") ? "png" : "jpg";
        triggerBlobDownload(blob, `${post.date || "lucrattiva"}-${slug}.${ext}`);
      } else {
        const zip = new JSZip();
        for (let i = 0; i < images.length; i++) {
          const res = await fetch(images[i]);
          const blob = await res.blob();
          const ext = blob.type.includes("png") ? "png" : "jpg";
          zip.file(`${String(i + 1).padStart(2, "0")}.${ext}`, blob);
        }
        const zipBlob = await zip.generateAsync({ type: "blob" });
        triggerBlobDownload(zipBlob, `${post.date || "lucrattiva"}-${slug}.zip`);
      }
      showToast("Download iniciado.");
    } catch (err) {
      showToast("Não foi possível baixar agora. Tente de novo.");
    }
  }

  function render() {
    const list = Array.from(posts.values())
      .filter((p) => currentFilter === "todos" || p.status === currentFilter)
      .sort((a, b) => (sortKey(b) < sortKey(a) ? -1 : sortKey(b) > sortKey(a) ? 1 : 0));

    countLabel.textContent = list.length === 1 ? "1 item" : `${list.length} itens`;

    if (posts.size === 0) {
      grid.hidden = true;
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;
    grid.hidden = false;

    grid.innerHTML = list.map((p) => {
      const images = Array.isArray(p.images) ? p.images : [];
      let media = "Sem imagem";
      if (images.length) {
        const idx = Math.min(slideIndex.get(p.id) || 0, images.length - 1);
        media = `<img src="${images[idx]}" alt="${escapeHtml(p.theme)}" loading="lazy">`;
        if (images.length > 1) {
          media += `
            <button class="slide-nav prev" data-action="slide-prev" data-id="${p.id}" aria-label="Slide anterior">‹</button>
            <button class="slide-nav next" data-action="slide-next" data-id="${p.id}" aria-label="Próximo slide">›</button>
            <span class="slide-count">${idx + 1}/${images.length}</span>
          `;
        }
      }
      const next = NEXT_STATUS[p.status];
      const nextLabel = NEXT_LABEL[p.status];
      const actionBtn = p.status === "aprovado"
        ? `<button class="primary" data-action="publish" data-id="${p.id}">Postar agora</button>`
        : next
        ? `<button class="primary" data-action="advance" data-id="${p.id}">${nextLabel}</button>`
        : `<button disabled>Publicado ✓</button>`;
      const downloadBtn = (p.status !== "pendente" && images.length)
        ? `<button class="icon-btn" data-action="download" data-id="${p.id}" title="Baixar imagens" aria-label="Baixar imagens">⬇️</button>`
        : "";
      return `
        <article class="card">
          <div class="card-media">${media}</div>
          <div class="card-body">
            <div class="card-top">
              <span class="card-date">${formatDate(p.date)}</span>
              <span class="status-pill" data-status="${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
            </div>
            <h3 class="card-theme">${escapeHtml(p.theme || "Sem tema")}</h3>
            <div class="card-meta">
              <span class="tag">${escapeHtml(p.network || "—")}</span>
              <span class="tag">${escapeHtml(p.format || "—")}</span>
              <span class="card-time">🕐 ${escapeHtml(p.time || "—")}</span>
            </div>
            <p class="card-caption">${escapeHtml(p.caption || "")}</p>
            ${p.hashtags ? `<p class="card-hashtags">${escapeHtml(p.hashtags)}</p>` : ""}
            ${p.notes ? `<p class="card-notes">${escapeHtml(p.notes)}</p>` : ""}
            <div class="card-actions">
              ${actionBtn}
              ${downloadBtn}
              <button class="icon-btn ghost" data-action="delete" data-id="${p.id}" title="Excluir" aria-label="Excluir">🗑</button>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  grid.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const post = posts.get(id);
    if (!post) return;

    if (btn.dataset.action === "slide-prev" || btn.dataset.action === "slide-next") {
      const images = Array.isArray(post.images) ? post.images : [];
      if (!images.length) return;
      const cur = slideIndex.get(id) || 0;
      const delta = btn.dataset.action === "slide-prev" ? -1 : 1;
      slideIndex.set(id, (cur + delta + images.length) % images.length);
      render();
      return;
    }
    if (btn.dataset.action === "download") {
      downloadPostImages(post);
      return;
    }
    if (btn.dataset.action === "publish") {
      btn.disabled = true;
      btn.textContent = "Publicando…";
      try {
        const res = await authFetch(`/api/posts/publish?id=${id}`, { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "publish failed");
        post.status = "postado";
        posts.set(id, post);
        render();
        showToast("Publicado no Instagram!");
      } catch (err) {
        showToast("Falha ao publicar: " + (err.message || "tente de novo"));
        btn.disabled = false;
        btn.textContent = "Postar agora";
      }
      return;
    }
    if (btn.dataset.action === "advance") {
      const next = NEXT_STATUS[post.status];
      if (!next) return;
      btn.disabled = true;
      try {
        const res = await authFetch(`/api/posts/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: next }),
        });
        if (!res.ok) throw new Error("update failed");
        post.status = next;
        posts.set(id, post);
        render();
        showToast(next === "aprovado" ? "Conteúdo aprovado." : "Marcado como postado.");
      } catch (err) {
        showToast("Não foi possível atualizar. Tente de novo.");
        btn.disabled = false;
      }
    } else if (btn.dataset.action === "delete") {
      if (!confirm("Excluir este conteúdo do painel?")) return;
      try {
        const res = await authFetch(`/api/posts/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("delete failed");
        posts.delete(id);
        render();
        showToast("Conteúdo removido.");
      } catch (err) {
        showToast("Não foi possível remover. Tente de novo.");
      }
    }
  });

  $("#filterBar").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#filterBar button").forEach((b) => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    render();
  });

  const mobileToggle = $("#mobileToggle");
  mobileToggle.addEventListener("click", () => {
    $("#formPanel").classList.toggle("open");
  });

  $("#f-file").addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []);
    const hint = $("#uploadHint");
    const previews = $("#uploadPreviews");
    pendingImages = [];
    previews.innerHTML = "";
    if (!files.length) { hint.textContent = ""; return; }

    hint.textContent = `Preparando ${files.length} imagem(ns)…`;
    try {
      for (const file of files) {
        const dataUrl = await resizeToDataUrl(file);
        pendingImages.push(dataUrl);
        const img = document.createElement("img");
        img.src = dataUrl;
        img.alt = "Pré-visualização";
        previews.appendChild(img);
      }
      hint.textContent = files.length > 1
        ? `${files.length} imagens prontas (ordem = ordem do carrossel).`
        : "Imagem pronta.";
    } catch (err) {
      hint.textContent = "Falha ao processar alguma imagem. Tenta de novo.";
    }
  });

  $("#postForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitBtn = $("#submitBtn");
    submitBtn.disabled = true;
    try {
      const imageUrls = [];
      for (let i = 0; i < pendingImages.length; i++) {
        submitBtn.textContent = `Enviando imagem ${i + 1}/${pendingImages.length}…`;
        const res = await authFetch("/api/upload", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ filename: `slide-${i + 1}.jpg`, dataUrl: pendingImages[i] }),
        });
        if (!res.ok) throw new Error("upload failed");
        const { url } = await res.json();
        imageUrls.push(url);
      }

      submitBtn.textContent = "Salvando…";
      const res = await authFetch("/api/posts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          date: $("#f-date").value,
          time: $("#f-time").value,
          network: $("#f-network").value,
          format: $("#f-format").value,
          theme: $("#f-theme").value.trim(),
          caption: $("#f-caption").value.trim(),
          hashtags: $("#f-hashtags").value.trim(),
          notes: $("#f-notes").value.trim(),
          images: imageUrls,
        }),
      });
      if (!res.ok) throw new Error("save failed");
      const created = await res.json();
      posts.set(created.id, created);
      render();

      e.target.reset();
      $("#uploadPreviews").innerHTML = "";
      $("#uploadHint").textContent = "";
      pendingImages = [];
      $("#f-date").value = new Date().toISOString().slice(0, 10);
      showToast("Conteúdo adicionado ao painel.");
      $("#formPanel").classList.remove("open");
    } catch (err) {
      showToast("Não foi possível salvar. Verifique os campos e tente de novo.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Adicionar ao painel";
    }
  });

  $("#f-date").value = new Date().toISOString().slice(0, 10);
  $("#f-time").value = "07:30";

  // Deployment roda todo dia às 7h, horário de São Paulo (America/Sao_Paulo, UTC-3 o ano todo).
  function nextRunAt(now) {
    const spOffsetMs = 3 * 60 * 60 * 1000;
    const spNow = new Date(now.getTime() - spOffsetMs);
    const next = new Date(Date.UTC(spNow.getUTCFullYear(), spNow.getUTCMonth(), spNow.getUTCDate(), 7, 0, 0));
    if (spNow.getUTCHours() > 7 || (spNow.getUTCHours() === 7 && spNow.getUTCMinutes() > 0)) {
      next.setUTCDate(next.getUTCDate() + 1);
    }
    return new Date(next.getTime() + spOffsetMs);
  }

  function updateNextRunLabel() {
    const now = new Date();
    const next = nextRunAt(now);
    const diffMs = next - now;
    const h = Math.floor(diffMs / 3600000);
    const m = Math.floor((diffMs % 3600000) / 60000);
    $("#nextRunLabel").textContent =
      `Próxima postagem do agente: hoje/amanhã às 07:00 (SP) — em ${h}h${String(m).padStart(2, "0")}min`;
  }
  updateNextRunLabel();
  setInterval(updateNextRunLabel, 60000);

  async function loadPosts() {
    try {
      const res = await fetch("/api/posts", { cache: "no-store" });
      if (!res.ok) throw new Error("list failed");
      const list = await res.json();
      posts = new Map(list.map((p) => [p.id, p]));
      connEl.dataset.state = "live";
      $("#connLabel").textContent = "Sincronizado";
      loadingState.hidden = true;
      render();
    } catch (err) {
      connEl.dataset.state = "offline";
      $("#connLabel").textContent = "Conexão perdida — tentando de novo";
    }
  }

  loadPosts();
  setInterval(loadPosts, POLL_MS);
</script>
</body>
</html>
