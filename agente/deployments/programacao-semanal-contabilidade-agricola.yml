name: Programação semanal - contabilidade agrícola
agent: ../agents/agente-de-redes-sociais-contabilidade-agricola.md
environment_id: ../environments/agente-redes-sociais-agro-env.yml
initial_events:
  - type: user.message
    content:
      - type: text
        text: |
          Pesquise tendências atuais de redes sociais pra contabilidade agrícola e monte a
          programação desta semana (segunda a sábado, sem domingo). Não gere imagens nem
          legendas ainda, só o planejamento. Preencha uma linha por dia, no formato de tabela
          EXATO abaixo, sem mudar as colunas nem o cabeçalho:

          | Dia | Data | Tema | Formato | Horário recomendado |
          |-----|------|------|---------|----------------------|
          | Segunda | AAAA-MM-DD | tema do dia | Imagem/Carrossel/Reels | HH:MM |
schedule:
  type: cron
  expression: 0 6 * * 1
  timezone: America/Sao_Paulo
budget:
  type: limit
  max_list_cost:
    currency: USD
    amount: "500"
