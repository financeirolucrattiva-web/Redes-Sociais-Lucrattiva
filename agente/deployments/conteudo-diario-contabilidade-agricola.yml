name: Conteúdo diário - contabilidade agrícola
agent: ../agents/agente-de-redes-sociais-contabilidade-agricola.md
environment_id: ../environments/agente-redes-sociais-agro-env.yml
# vault_ids do e-mail (Gmail/Zapier) entra aqui depois que o vault existir —
# veja INSTRUCOES-EMAIL.md. Sem isso, o agente ainda não consegue enviar.
initial_events:
  - type: user.message
    content:
      - type: image
        source:
          type: base64
          media_type: image/jpeg
          data: "@../assets/logo-icone.jpg"
      - type: image
        source:
          type: base64
          media_type: image/png
          data: "@../assets/logo-banner.png"
      - type: text
        text: |
          As duas imagens acima são a identidade visual OFICIAL da Lucrattiva (ícone/logo e
          banner de exemplo). Use exatamente essas cores, formas, tipografia, proporções e
          estilo — não recrie a marca com outra paleta ou formato. Toda peça (imagem/carrossel)
          que você gerar deve parecer visualmente da mesma família dessas referências.

          Entregue o conteúdo completo (imagem/carrossel, legenda e horário) para postar hoje.
schedule:
  type: cron
  expression: 0 7 * * *
  timezone: America/Sao_Paulo
budget:
  type: limit
  max_list_cost:
    currency: USD
    amount: "2"
