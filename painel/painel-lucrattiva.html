<title>Painel Lucrattiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #F6F1E3;
    --surface: #FFFFFF;
    --surface-2: #EFE6CE;
    --ink: #201D14;
    --muted: #6C6450;
    --border: #E1D5B6;
    --border-soft: #ECE1C5;
    --accent: #1D4429;
    --accent-strong: #12301C;
    --accent-soft: #DEE9DE;
    --amber: #A97829;
    --amber-soft: #F1E0B4;
    --slate: #6E6142;
    --slate-soft: #E9E0C7;
    --red: #A5432B;
    --shadow: 0 1px 2px rgba(32, 27, 10, 0.07), 0 8px 24px -12px rgba(32, 27, 10, 0.2);
    --radius: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14150D;
      --surface: #1C1C13;
      --surface-2: #262518;
      --ink: #F0EAD6;
      --muted: #A9A084;
      --border: #383623;
      --border-soft: #2C2A1A;
      --accent: #75A664;
      --accent-strong: #9CC98A;
      --accent-soft: #223020;
      --amber: #DCAD5B;
      --amber-soft: #3B2E14;
      --slate: #BBAE85;
      --slate-soft: #2E2A18;
      --red: #E0917A;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14150D;
    --surface: #1C1C13;
    --surface-2: #262518;
    --ink: #F0EAD6;
    --muted: #A9A084;
    --border: #383623;
    --border-soft: #2C2A1A;
    --accent: #75A664;
    --accent-strong: #9CC98A;
    --accent-soft: #223020;
    --amber: #DCAD5B;
    --amber-soft: #3B2E14;
    --slate: #BBAE85;
    --slate-soft: #2E2A18;
    --red: #E0917A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    padding-inline: 20px;
    padding-block: 20px 48px;
    max-width: 1180px;
    margin-inline: auto;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; text-wrap: balance; margin: 0; }
  a { color: inherit; }
  button { font-family: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { flex: none; width: 42px; height: 42px; }
  .brand h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-strong); }
  .brand .subtitle { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }

  .conn {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.82rem;
    color: var(--muted);
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .conn[data-state="live"] .dot { background: var(--accent); }
  .conn[data-state="live"] { color: var(--accent-strong); border-color: var(--accent-soft); }

  .layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    position: sticky;
    top: 20px;
  }
  @media (max-width: 860px) {
    .form-panel { position: static; }
  }
  .mobile-toggle { display: none; }
  @media (max-width: 860px) {
    .mobile-toggle {
      display: flex;
      width: 100%;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .post-form { display: none; margin-top: 16px; }
    .form-panel.open .post-form { display: flex; }
  }

  .post-form { display: flex; flex-direction: column; gap: 12px; }
  .post-form h2 { font-size: 1.15rem; margin-bottom: 2px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  input, select, textarea {
    font: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    width: 100%;
  }
  textarea { resize: vertical; min-height: 64px; font-family: inherit; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  .upload-row { display: flex; align-items: center; gap: 10px; }
  .upload-btn {
    border: 1px dashed var(--border);
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 1;
    text-align: center;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .upload-preview { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); flex: none; }
  .upload-hint { font-size: 0.78rem; color: var(--muted); }

  .submit-btn {
    margin-top: 4px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover { background: var(--accent-strong); }
  .submit-btn:disabled { opacity: 0.6; cursor: progress; }

  .feed-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .segmented {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .segmented button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .segmented button.active { background: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 0.85rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-media {
    aspect-ratio: 4 / 3;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.8rem;
    overflow: hidden;
  }
  .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-date { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
  .status-pill {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .status-pill[data-status="pendente"] { background: var(--amber-soft); color: var(--amber); }
  .status-pill[data-status="aprovado"] { background: var(--accent-soft); color: var(--accent-strong); }
  .status-pill[data-status="postado"] { background: var(--slate-soft); color: var(--slate); }

  .card-theme { font-family: "Fraunces", Georgia, serif; font-size: 1.05rem; font-weight: 600; line-height: 1.25; }
  .card-meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
  .tag { border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
  .card-caption {
    font-size: 0.87rem;
    color: var(--ink);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-hashtags { font-size: 0.78rem; color: var(--slate); word-break: break-word; }
  .card-notes { font-size: 0.78rem; color: var(--muted); font-style: italic; }
  .card-time {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 600;
  }

  .card-actions { margin-top: auto; display: flex; gap: 8px; padding-top: 4px; }
  .card-actions button {
    flex: 1;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--ink);
  }
  .card-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card-actions button.primary:hover { background: var(--accent-strong); }
  .card-actions button.ghost:hover { border-color: var(--red); color: var(--red); }
  .icon-btn {
    flex: none !important;
    width: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty, .loading {
    text-align: center;
    color: var(--muted);
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 0.92rem;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ink);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 0.85rem;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="topbar">
  <div class="brand">
    <svg viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="21" cy="21" r="21" fill="var(--accent-soft)"/>
      <rect x="9" y="20" width="6" height="10" rx="1.4" fill="var(--accent-strong)"/>
      <rect x="18" y="14" width="6" height="16" rx="1.4" fill="var(--amber)"/>
      <rect x="27" y="8" width="6" height="22" rx="1.4" fill="var(--accent-strong)"/>
    </svg>
    <div>
      <h1>Lucrattiva <span style="color: var(--amber); font-weight: 500;">Social</span></h1>
      <p class="subtitle">Lucrattiva Contabilidade · revisão do conteúdo diário</p>
    </div>
  </div>
  <div class="conn" id="connStatus" data-state="offline">
    <span class="dot"></span>
    <span id="connLabel">Conectando…</span>
  </div>
</div>

<div class="layout">
  <aside class="form-panel" id="formPanel">
    <button class="mobile-toggle" id="mobileToggle" type="button">+ Novo conteúdo</button>
    <form class="post-form" id="postForm">
      <h2>Novo conteúdo</h2>
      <div class="field-row">
        <div class="field">
          <label for="f-date">Data</label>
          <input type="date" id="f-date" required>
        </div>
        <div class="field">
          <label for="f-time">Horário</label>
          <input type="time" id="f-time" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-network">Rede</label>
          <select id="f-network">
            <option>Instagram</option>
            <option>Facebook</option>
            <option>LinkedIn</option>
            <option>WhatsApp</option>
            <option>Outra</option>
          </select>
        </div>
        <div class="field">
          <label for="f-format">Formato</label>
          <select id="f-format">
            <option>Imagem</option>
            <option>Carrossel</option>
            <option>Reels</option>
            <option>Vídeo</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="f-theme">Tema</label>
        <input type="text" id="f-theme" placeholder="Ex: Prazo do ITR 2026" required>
      </div>
      <div class="field">
        <label for="f-caption">Legenda final</label>
        <textarea id="f-caption" placeholder="Texto pronto para publicar" required></textarea>
      </div>
      <div class="field">
        <label for="f-hashtags">Hashtags / marcações</label>
        <input type="text" id="f-hashtags" placeholder="#ContabilidadeRural #ITR2026">
      </div>
      <div class="field">
        <label for="f-file">Imagem / capa do carrossel</label>
        <div class="upload-row">
          <label class="upload-btn" id="uploadLabel" for="f-file">Escolher arquivo…</label>
          <input type="file" id="f-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          <img id="uploadPreview" class="upload-preview" hidden alt="Pré-visualização">
        </div>
        <span class="upload-hint" id="uploadHint"></span>
      </div>
      <div class="field">
        <label for="f-notes">Observações internas (opcional)</label>
        <textarea id="f-notes" placeholder="Ex: aguardando aprovação da sócia"></textarea>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Adicionar ao painel</button>
    </form>
  </aside>

  <main class="feed">
    <div class="feed-controls">
      <div class="segmented" id="filterBar" role="tablist">
        <button data-filter="todos" class="active" role="tab" aria-selected="true">Todos</button>
        <button data-filter="pendente" role="tab" aria-selected="false">Pendente</button>
        <button data-filter="aprovado" role="tab" aria-selected="false">Aprovado</button>
        <button data-filter="postado" role="tab" aria-selected="false">Postado</button>
      </div>
      <span class="count" id="countLabel"></span>
    </div>
    <div class="grid" id="grid" hidden></div>
    <p class="loading" id="loadingState">Carregando conteúdo…</p>
    <p class="empty" id="emptyState" hidden>Nenhum conteúdo por aqui ainda. Use o formulário ao lado para adicionar o primeiro.</p>
  </main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
  const STATUS_LABEL = { pendente: "Pendente", aprovado: "Aprovado", postado: "Postado" };
  const NEXT_STATUS = { pendente: "aprovado", aprovado: "postado" };
  const NEXT_LABEL = { pendente: "Aprovar", aprovado: "Marcar como postado" };

  let db = null;
  let assets = null;
  let canUpload = false;
  let posts = new Map();
  let currentFilter = "todos";
  let pendingImage = null; // {id}

  const $ = (sel) => document.querySelector(sel);
  const grid = $("#grid");
  const loadingState = $("#loadingState");
  const emptyState = $("#emptyState");
  const countLabel = $("#countLabel");
  const toastEl = $("#toast");

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  function formatDate(iso) {
    if (!iso) return "—";
    const [y, m, d] = iso.split("-");
    if (!y || !m || !d) return iso;
    return `${d}/${m}/${y}`;
  }

  function sortKey(p) {
    return `${p.date || "0000-00-00"} ${p.time || "00:00"}`;
  }

  function render() {
    const list = Array.from(posts.values())
      .filter((p) => currentFilter === "todos" || p.status === currentFilter)
      .sort((a, b) => (sortKey(b) < sortKey(a) ? -1 : sortKey(b) > sortKey(a) ? 1 : 0));

    countLabel.textContent = list.length === 1 ? "1 item" : `${list.length} itens`;

    if (posts.size === 0) {
      grid.hidden = true;
      emptyState.hidden = false;
      return;
    }
    emptyState.hidden = true;
    grid.hidden = false;

    grid.innerHTML = list.map((p) => {
      const img = p.imageAssetId
        ? `<img src="/_blob/${p.imageAssetId}" alt="${escapeHtml(p.theme)}" loading="lazy">`
        : `Sem imagem`;
      const next = NEXT_STATUS[p.status];
      const nextLabel = NEXT_LABEL[p.status];
      const actionBtn = next
        ? `<button class="primary" data-action="advance" data-id="${p.id}">${nextLabel}</button>`
        : `<button disabled>Publicado ✓</button>`;
      return `
        <article class="card">
          <div class="card-media">${img}</div>
          <div class="card-body">
            <div class="card-top">
              <span class="card-date">${formatDate(p.date)}</span>
              <span class="status-pill" data-status="${p.status}">${STATUS_LABEL[p.status] || p.status}</span>
            </div>
            <h3 class="card-theme">${escapeHtml(p.theme || "Sem tema")}</h3>
            <div class="card-meta">
              <span class="tag">${escapeHtml(p.network || "—")}</span>
              <span class="tag">${escapeHtml(p.format || "—")}</span>
              <span class="card-time">🕐 ${escapeHtml(p.time || "—")}</span>
            </div>
            <p class="card-caption">${escapeHtml(p.caption || "")}</p>
            ${p.hashtags ? `<p class="card-hashtags">${escapeHtml(p.hashtags)}</p>` : ""}
            ${p.notes ? `<p class="card-notes">${escapeHtml(p.notes)}</p>` : ""}
            <div class="card-actions">
              ${actionBtn}
              <button class="icon-btn ghost" data-action="delete" data-id="${p.id}" title="Excluir" aria-label="Excluir">🗑</button>
            </div>
          </div>
        </article>
      `;
    }).join("");
  }

  grid.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn || !db) return;
    const id = btn.dataset.id;
    const post = posts.get(id);
    if (!post) return;
    const ref = db.collection("posts").doc(id);
    if (btn.dataset.action === "advance") {
      const next = NEXT_STATUS[post.status];
      if (!next) return;
      btn.disabled = true;
      try {
        await ref.update({ status: next });
        showToast(next === "aprovado" ? "Conteúdo aprovado." : "Marcado como postado.");
      } catch (err) {
        showToast("Não foi possível atualizar. Tente de novo.");
        btn.disabled = false;
      }
    } else if (btn.dataset.action === "delete") {
      if (!confirm("Excluir este conteúdo do painel?")) return;
      try {
        await ref.delete();
        showToast("Conteúdo removido.");
      } catch (err) {
        showToast("Não foi possível remover. Tente de novo.");
      }
    }
  });

  $("#filterBar").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-filter]");
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll("#filterBar button").forEach((b) => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-selected", b === btn ? "true" : "false");
    });
    render();
  });

  const mobileToggle = $("#mobileToggle");
  mobileToggle.addEventListener("click", () => {
    $("#formPanel").classList.toggle("open");
  });

  $("#f-file").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    const hint = $("#uploadHint");
    const preview = $("#uploadPreview");
    pendingImage = null;
    if (!file) { hint.textContent = ""; preview.hidden = true; return; }

    preview.src = URL.createObjectURL(file);
    preview.hidden = false;

    if (!assets) {
      hint.textContent = "Envio de imagem indisponível nesta visualização — o restante do conteúdo pode ser salvo normalmente.";
      return;
    }
    hint.textContent = "Enviando imagem…";
    try {
      const result = await assets.upload(file);
      pendingImage = result;
      hint.textContent = "Imagem pronta.";
    } catch (err) {
      hint.textContent = "Falha ao enviar a imagem. Você pode salvar sem ela e tentar de novo depois.";
    }
  });

  $("#postForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!db) { showToast("Ainda conectando ao painel — tente de novo em instantes."); return; }
    const submitBtn = $("#submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Salvando…";
    try {
      await db.collection("posts").add({
        date: $("#f-date").value,
        time: $("#f-time").value,
        network: $("#f-network").value,
        format: $("#f-format").value,
        theme: $("#f-theme").value.trim(),
        caption: $("#f-caption").value.trim(),
        hashtags: $("#f-hashtags").value.trim(),
        notes: $("#f-notes").value.trim(),
        imageAssetId: pendingImage ? pendingImage.id : null,
        status: "pendente",
        createdAt: new Date().toISOString(),
      });
      e.target.reset();
      $("#uploadPreview").hidden = true;
      $("#uploadHint").textContent = "";
      pendingImage = null;
      $("#f-date").value = new Date().toISOString().slice(0, 10);
      showToast("Conteúdo adicionado ao painel.");
      $("#formPanel").classList.remove("open");
    } catch (err) {
      showToast("Não foi possível salvar. Verifique os campos e tente de novo.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Adicionar ao painel";
    }
  });

  $("#f-date").value = new Date().toISOString().slice(0, 10);
  $("#f-time").value = "07:30";

  async function init() {
    if (!window.claude || !window.claude.use) return;
    db = await window.claude.use("db");
    assets = await window.claude.use("assets");
    canUpload = !!assets;
    if (!canUpload) {
      $("#uploadLabel").style.opacity = "0.6";
    }

    const connEl = $("#connStatus");
    if (!db) {
      connEl.dataset.state = "offline";
      $("#connLabel").textContent = "Painel somente leitura indisponível aqui";
      loadingState.textContent = "Não foi possível conectar ao painel nesta visualização.";
      return;
    }

    db.collection("posts").onSnapshot(
      (snap) => {
        connEl.dataset.state = "live";
        $("#connLabel").textContent = "Sincronizado";
        loadingState.hidden = true;
        posts.clear();
        snap.docs.forEach((d) => {
          if (d.exists) posts.set(d.id, { id: d.id, ...d.data() });
        });
        render();
      },
      (err) => {
        connEl.dataset.state = "offline";
        $("#connLabel").textContent = "Conexão perdida";
      }
    );
  }
  init();
</script>
